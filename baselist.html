<div class="row m-1 p-1 basemenu shadow rounded">
    <div class="col-12 p-1 me-2 d-flex align-items-center">
        <div class="dropdown me-2">
            <button class="btn btn-light border-secondary float-right menu" data-bs-toggle="dropdown"
                aria-expanded="true" id="global_menu">
                <i class="fas fa-bars text-black"></i>
            </button>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="global_menu" style="z-index: 1090"
                id="main_menu">
                <a class="dropdown-item"><span></span></a>
                <span class="dropdown-item"></span>
                <div class="dropdown-divider"></div>
            </div>
        </div>
        <a href="javascript:cMapMaker.about()" class="col">
            <span class="title" glot-model="site_title"
                style="font-size: clamp(1rem, 1.5vw, 1.2rem) !important;white-space: nowrap;"></span><br />
            <span class="subtitle" glot-model="site_subtitle"
                style="font-size: clamp(0.8rem, 1vw, 1.0rem) !important;"></span>
        </a>
        <span id="changesButtonMobile" class="ms-1 me-1 flex-shrink-0"></span>
        <button class="btn btn-sm btn-outline-primary poi-toolbar-button flex-shrink-0" type="button"
            id="poiFilterButton" onclick="poiFilterController.open('search')"
            aria-haspopup="dialog" aria-controls="poiFilterModal" aria-label="詳しい条件" data-area-aria="placeFilter_title" title="詳しい条件" data-glot-title="placeFilter_title">
            <i class="fa-solid fa-sliders" aria-hidden="true"></i>
        </button>
        <aside id="mapDisplayStatus" class="map-display-status" aria-label="地図の表示状態" data-area-aria="mapDisplay_label" hidden>
            <div class="map-display-row">
                <span class="map-display-label" data-area-label="mapDisplay_label">地図</span>
                <div id="mapDisplayTargets" class="map-display-targets"></div>
            </div>
            <div id="mapDisplayReason" class="map-display-reason" role="status" hidden>
                <span id="mapDisplayReasonText"></span>
                <button class="btn btn-sm" type="button" onclick="this.parentElement.hidden = true" aria-label="説明を閉じる" data-area-aria="mapDisplay_close">&times;</button>
            </div>
            <div id="mapDisplayConditions" class="map-display-row map-display-conditions" hidden>
                <span class="map-display-label" data-area-label="mapDisplay_conditions">条件</span>
                <div id="mapDisplayConditionChips" class="map-display-targets"></div>
            </div>
            <div id="areaFeatureSummary" class="area-feature-summary" aria-live="polite" hidden>
                <span class="map-display-label" data-area-label="mapDisplay_areaSearch">施設検索</span>
                <div id="areaFeatureChips" class="area-feature-chips"></div>
                <strong id="areaFeatureResultCount"></strong>
                <button class="btn btn-sm btn-light border-secondary" type="button" onclick="areaSearchController.reapplyCurrentView()" data-area-label="areaSearchUi_reapply"></button>
                <button class="btn btn-sm btn-outline-danger" type="button" onclick="areaSearchController.clear()" aria-label="" data-area-aria="areaSearchUi_clearAria" data-area-label="areaSearchUi_clear"></button>
            </div>
        </aside>

    </div>
    <!--セレクト&ボタン-->
    <div class="col-4 d-flex align-items-center ps-0 pe-0">
        <div class="h-100 d-flex align-items-center text-nowrap p-1"><span glot-model="cat_select"></span></div>
        <select class="form-select me-1" id="list_category"></select>
    </div>

    <!-- 検索 -->
    <div class="col-8 d-flex align-items-center ps-0 pe-0">
        <div class="search-box">
            <input type="text" class="form-control" id="list_keyword" />
            <button class="search-btn" onclick="cMapMaker.searchKeyword(list_keyword.value);">
                <i class="fas fa-search" id="list_keyword_search"></i></button>
        </div>

        <!--- button class="btn btn-light border-secondary float-left ms-1 me-1" onclick="cMapMaker.changeMode();"><i
                class="fas fa-list" id="list_collapse_icon"></i></button --->
    </div>
    <div id="listActionButtons" class="col-2 col-sm-1 d-flex px-1 list-actions" hidden></div>
</div>
